<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta http-equiv="Cache-Control" content="no-transform">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>a clock</title>
<meta name="keywords" content="手机时间全屏显示,在线时钟,在线时钟显示,在线钟表,时间显示大屏,时钟大屏,全屏时间,在线时间显示">
<meta name="description" content="在线时钟显示为您提供最新的时间,实现在线网页闹钟功能,手机时间全屏显示,打开即用。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"></noscript>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"></noscript>
<link rel="stylesheet" href="css/clockindex.css">
<style>
  body { font-family: 'Roboto', 'Hei', Helvetica, Arial, sans-serif; }

  /* ===== Material Design top bar ===== */
  .md-topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: #1f1f1f;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
    z-index: 1000;
  }
  .md-brand {
    color: #fff;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: .2px;
    margin-right: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .md-brand .material-symbols-outlined { font-size: 24px; color: #FA9F22; }
  .md-spacer { flex: 1; }
  .md-nav { display: flex; align-items: center; gap: 2px; }

  /* ===== Material buttons ===== */
  .md-btn {
    font-family: 'Roboto', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: .5px;
    border: none;
    border-radius: 20px;
    padding: 10px 18px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    line-height: 1;
    transition: background-color .2s ease, box-shadow .2s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .md-btn:active { transform: translateY(1px); }
  .md-btn-filled {
    background: #6750A4;
    color: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  .md-btn-filled:hover { background: #7a5cb8; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .md-btn-text {
    background: transparent;
    color: #fff;
    padding: 10px 12px;
  }
  .md-btn-text:hover { background: rgba(255,255,255,.12); }
  .md-btn-text .material-symbols-outlined { font-size: 20px; }

  /* ===== Material language dropdown (MD3 filled field) ===== */
  .md-lang { position: relative; display: flex; align-items: center; }
  .md-select {
    appearance: none;
    -webkit-appearance: none;
    font-family: 'Roboto', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    background-color: #2d2d2d;
    border: none;
    border-radius: 8px;
    padding: 10px 36px 10px 14px;
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='white'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
    background-size: 20px;
  }
  .md-select:focus { outline: 2px solid #6750A4; }

  /* ===== Location / timezone chip ===== */
  .md-tz {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #fff;
    background: rgba(255,255,255,.10);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
  }
  .md-tz .material-symbols-outlined { font-size: 18px; color: #89D9D6; }

  /* ===== Two-screen stage (native scroll-snap to switch) ===== */
  .stage {
    position: fixed;
    inset: 0;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .stage::-webkit-scrollbar { display: none; }
  .screen {
    height: 100vh;
    scroll-snap-align: start;
    position: relative;
    overflow: hidden;
  }
  .stage:-webkit-full-screen,
  .stage:-moz-full-screen,
  .stage:fullscreen {
    width: 100%;
    height: 100%;
    overflow-y: scroll;
  }

  /* ===== Digital local time (screen 2, centered) ===== */
  .digi {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-family: 'Roboto', sans-serif;
    font-size: clamp(40px, 10vw, 96px);
    font-weight: 500;
    letter-spacing: 2px;
    text-align: center;
    text-shadow: 0 2px 10px rgba(0,0,0,.6);
    z-index: 900;
    user-select: none;
  }
  .digi .digi-tz {
    display: block;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 1px;
    opacity: .75;
    margin-top: 8px;
  }

  @media (max-width: 760px) {
    .md-brand span.md-brand-text { display: none; }
    .md-btn-text { padding: 8px; font-size: 12px; }
    .md-btn-filled { padding: 8px 14px; font-size: 12px; }
  }
</style>
</head>
<body>
<header class="md-topbar">
  <span class="md-brand">
    <span class="material-symbols-outlined">schedule</span>
    <span class="md-brand-text">a clock</span>
  </span>
  <div class="md-spacer"></div>
  <nav class="md-nav">
    <span class="md-tz" id="tzLabel">
      <span class="material-symbols-outlined">location_on</span>
      <span id="tzText">--</span>
    </span>
    <div class="md-lang">
      <select id="langSelect" class="md-select" aria-label="Language">
        <option value="auto">Auto</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="ru">Русский</option>
      </select>
    </div>
    <button id="btn" class="md-btn md-btn-filled" onclick="btnClick()">
      <span class="material-symbols-outlined">fullscreen</span>
      <span data-i18n="fullscreen">点我全屏</span>
    </button>
  </nav>
</header>

<div class="stage" id="stage">
  <section class="screen">
    <div id="content">
      <div class="fill">
        <div class="reference"></div>
        <div class="clock" id="utility-clock">
          <div class="centre">
            <div class="dynamic"></div>
            <div class="expand round circle-1"></div>
            <div class="anchor hour">
              <div class="element shi-thin-hand"></div>
              <div class="element shi-hand"></div>
            </div>
            <div class="anchor minute">
              <div class="element thin-hand"></div>
              <div class="element fat-hand minute-hand"></div>
            </div>
            <div class="anchor second">
              <div class="element second-hand"></div>
            </div>
            <div class="expand round circle-2"></div>
            <div class="expand round circle-3"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="screen">
    <div id="digi" class="digi">
      <span id="digiTime">--:--:--</span>
      <span class="digi-tz" id="digiTz"></span>
    </div>
  </section>
</div>

<script type="text/javascript">
    	var clock = document.querySelector('#utility-clock')
		utilityClock(clock)
		if (clock.parentNode.classList.contains('fill')) autoResize(clock, 295 + 32)

		// Detect the visitor's timezone / location
		var userTimeZone = (function () {
		  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'local'; }
		  catch (e) { return 'local'; }
		})();
		(function () {
		  var city = userTimeZone === 'local' ? 'Local' : userTimeZone.split('/').pop().replace(/_/g, ' ');
		  var tzText = document.getElementById('tzText');
		  var digiTz = document.getElementById('digiTz');
		  if (tzText) tzText.textContent = city;
		  if (digiTz) digiTz.textContent = userTimeZone === 'local' ? '' : userTimeZone;
		})();

		function utilityClock(container) {
		    var dynamic = container.querySelector('.dynamic')
		    var hourElement = container.querySelector('.hour')
		    var minuteElement = container.querySelector('.minute')
		    var secondElement = container.querySelector('.second')
		    var digiTime = document.getElementById('digiTime')
		    var minute = function(n) {
		        return n % 5 == 0 ? minuteText(n) : minuteLine(n)
		    }
		    var minuteText = function(n) {
		        var element = document.createElement('div')
		        element.className = 'minute-text'
		        element.innerHTML = (n < 10 ? '0' : '') + n
		        position(element, n / 60, 135)
		        dynamic.appendChild(element)
		    }
		    var minuteLine = function(n) {
		        var anchor = document.createElement('div')
		        anchor.className = 'anchor'
		        var element = document.createElement('div')
		        element.className = 'element minute-line'
		        rotate(anchor, n)
		        anchor.appendChild(element)
		        dynamic.appendChild(anchor)
		    }
		    var hour = function(n) {
		        var element = document.createElement('div')
		        element.className = 'hour-text hour-' + n
		        element.innerHTML = n
		        position(element, n / 12, 105)
		        dynamic.appendChild(element)
		    }
		    var position = function(element, phase, r) {
		        var theta = phase * 2 * Math.PI
		        element.style.top = (-r * Math.cos(theta)).toFixed(1) + 'px'
		        element.style.left = (r * Math.sin(theta)).toFixed(1) + 'px'
		    }
		    var rotate = function(element, second) {
		        element.style.transform = element.style.webkitTransform = 'rotate(' + (second * 6) + 'deg)'
		    }
		    var timeInZone = function() {
		        var now = new Date()
		        if (userTimeZone === 'local') {
		            return now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000
		        }
		        var parts = new Intl.DateTimeFormat('en-US', {
		            timeZone: userTimeZone, hour12: false,
		            hour: '2-digit', minute: '2-digit', second: '2-digit'
		        }).formatToParts(now)
		        var h = 0, m = 0, s = 0
		        for (var i = 0; i < parts.length; i++) {
		            if (parts[i].type === 'hour') h = parseInt(parts[i].value, 10) % 24
		            else if (parts[i].type === 'minute') m = parseInt(parts[i].value, 10)
		            else if (parts[i].type === 'second') s = parseInt(parts[i].value, 10)
		        }
		        return h * 3600 + m * 60 + s + now.getMilliseconds() / 1000
		    }
		    var animate = function() {
		        var time = timeInZone()
		        rotate(secondElement, time)
		        rotate(minuteElement, time / 60)
		        rotate(hourElement, time / 60 / 12)
		        if (digiTime) {
		            var total = Math.floor(time)
		            var hh = Math.floor(total / 3600) % 24
		            var mm = Math.floor(total / 60) % 60
		            var ss = total % 60
		            var p = function(n){ return (n < 10 ? '0' : '') + n }
		            digiTime.textContent = p(hh) + ':' + p(mm) + ':' + p(ss)
		        }
		        requestAnimationFrame(animate)
		    }
		    for (var i = 1; i <= 60; i ++) minute(i)
		    for (var i = 1; i <= 12; i ++) hour(i)
		    animate()
		}

		function autoResize(element, nativeSize) {
		    var update = function() {
		        var scale = Math.min(window.innerWidth, window.innerHeight) / nativeSize
		        element.style.transform = element.style.webkitTransform = 'scale(' + scale.toFixed(3) + ')'
		    }
		    update()
		    window.addEventListener('resize', update)
		}
    </script> 
    
    <script>
    function btnClick(){
      	var element= document.getElementById("stage"); 
      	if (isFullscreen()) {
      		exitFullScreen();
	   	} else {
   		  	if (element.requestFullscreen) {
	        	element.requestFullscreen();
	      	} else if (element.webkitRequestFullScreen) {
	        	element.webkitRequestFullScreen();
	      	} else if (element.mozRequestFullScreen) {
	        	element.mozRequestFullScreen();
	      	} else if (element.msRequestFullscreen) {
	        	element.msRequestFullscreen();
	      	}
	    }
  	}
  
	// 退出全屏
	function exitFullScreen () {
	    let exitFullScreen = document.exitFullScreen || 
	    document.mozCancelFullScreen || 
	    document.webkitExitFullscreen || 
	    document.msExitFullscreen;
	    if (exitFullScreen) {
	      exitFullScreen.call(document);
	    }
	 }
	// 判断是否全屏
	function isFullscreen () {
	    return document.fullscreenElement ||
	      document.msFullscreenElement ||
	      document.mozFullScreenElement ||
	      document.webkitFullscreenElement || false;
	 }
  </script>
<script>
let wakeLock = null;
async function keepScreen() {
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => wakeLock = null);
    } catch (e) {}
  }
}
document.body.addEventListener('click', () => keepScreen(), { once: true });
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && !wakeLock) keepScreen();
})
</script>

<!-- ===== Multi-language (auto-detect + manual) ===== -->
<script>
  const I18N = {
    zh: { fullscreen:'点我全屏' },
    en: { fullscreen:'Fullscreen' },
    ja: { fullscreen:'全画面' },
    ko: { fullscreen:'전체화면' },
    es: { fullscreen:'Pantalla completa' },
    fr: { fullscreen:'Plein écran' },
    de: { fullscreen:'Vollbild' },
    ru: { fullscreen:'Полный экран' }
  };
  const SUPPORTED = Object.keys(I18N);

  function detectLang() {
    const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
    return SUPPORTED.includes(nav) ? nav : 'en';
  }

  let current = localStorage.getItem('lang') || 'auto';
  function resolve() { return current === 'auto' ? detectLang() : current; }

  function applyLang(lang) {
    const t = I18N[lang] || I18N.en;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      const key = el.getAttribute('data-i18n');
      if (t[key]) el.textContent = t[key];
    });
    document.documentElement.lang = lang;
    document.title = 'a clock';
  }

  applyLang(resolve());
  const sel = document.getElementById('langSelect');
  sel.value = current;
  sel.addEventListener('change', function (e) {
    current = e.target.value;
    localStorage.setItem('lang', current);
    applyLang(resolve());
  });
</script>

<!-- ===== Smooth screen switching: wheel + touch swipe + arrow keys ===== -->
<script>
  (function () {
    var stage = document.getElementById('stage');
    if (!stage) return;
    var idx = 0;                 // 0 = analog clock, 1 = digital time
    var lock = false;

    function go(to) {
      to = to < 0 ? 0 : (to > 1 ? 1 : to);
      if (to === idx) return;
      idx = to;
      stage.scrollTo({ top: idx * window.innerHeight, behavior: 'smooth' });
    }
    function goDelta(d) {
      if (lock) return;
      lock = true;
      go(idx + d);
      setTimeout(function () { lock = false; }, 650);
    }

    // Mouse wheel
    stage.addEventListener('wheel', function (e) {
      e.preventDefault();
      if (Math.abs(e.deltaY) < 8) return;
      goDelta(e.deltaY > 0 ? 1 : -1);
    }, { passive: false });

    // Touch swipe (block native scroll so it only slides one screen per swipe)
    var startY = null;
    stage.addEventListener('touchstart', function (e) {
      startY = e.touches[0].clientY;
    }, { passive: true });
    stage.addEventListener('touchmove', function (e) {
      e.preventDefault();
    }, { passive: false });
    stage.addEventListener('touchend', function (e) {
      if (startY === null) return;
      var dy = e.changedTouches[0].clientY - startY;
      startY = null;
      if (dy < -40) goDelta(1);        // swipe up -> next
      else if (dy > 40) goDelta(-1);   // swipe down -> prev
    }, { passive: true });

    // Keyboard arrows
    window.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'PageDown') { goDelta(1); e.preventDefault(); }
      else if (e.key === 'ArrowUp' || e.key === 'PageUp') { goDelta(-1); e.preventDefault(); }
    });

    // Mouse drag (press and move up/down) to switch
    var mDown = false, mStartY = 0;
    stage.addEventListener('mousedown', function (e) {
      if (e.target.closest('button, select, a, input')) return; // don't hijack control clicks
      mDown = true;
      mStartY = e.clientY;
    });
    window.addEventListener('mousemove', function (e) {
      if (!mDown) return;
      e.preventDefault(); // stop text selection while dragging
    });
    window.addEventListener('mouseup', function (e) {
      if (!mDown) return;
      var dy = e.clientY - mStartY;
      mDown = false;
      if (dy < -40) goDelta(1);        // drag up -> next
      else if (dy > 40) goDelta(-1);   // drag down -> prev
    });
  })();
</script>
